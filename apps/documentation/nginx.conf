server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  error_page 404 /404.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  access_log off;

  # ── Pages ──────────────────────────────────────────────────────────────────
  #
  # Next.js static export writes `organization.html`, not
  # `organization/index.html`. Without the `$uri.html` step every clean URL in the
  # site 404s — the single most likely way to break this deployment.
  #
  # `=404` rather than falling back to /404.html directly: naming the file here
  # would serve it with a 200 status — a soft 404, which tells crawlers and link
  # checkers that the page exists. `error_page` above renders the same page with
  # the correct status.
  location / {
    try_files $uri $uri.html $uri/index.html =404;

    # HTML must revalidate or a deploy stays invisible until browser caches
    # expire. Note this cannot be done with a `location ~* \.html$` block: the
    # request URI has no extension, so such a block never matches.
    add_header Cache-Control "no-cache, must-revalidate" always;

    # nginx does NOT inherit `add_header` from the server block into any location
    # that declares its own. The security headers are therefore repeated in every
    # location below rather than set once at server level, where they would be
    # silently dropped exactly where assets are served.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  # ── Build output ───────────────────────────────────────────────────────────
  # Content-hashed filenames, so these can be cached indefinitely.
  location /_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  # ── Search index ───────────────────────────────────────────────────────────
  # NOT content-hashed — it keeps the same filename across builds. Caching it for
  # a year would leave visitors searching an index that no longer matches the
  # pages it points at.
  location = /_next/static/chunks/nextra-data-en-US.json {
    add_header Cache-Control "public, max-age=300, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }
}

version: "3.8"

# HubSign documentation portal — docs.hubsign.io
#
# This is the compose Komodo holds inline for the `hubsign-docs` stack. It is kept
# in the repository so the deployed configuration is reviewable in git, but Komodo
# stores its own copy (every stack on this instance uses inline file_contents).
# Change both when you change either.
#
# Image is built by the Komodo build `hubsign-docs` from
# apps/documentation/Dockerfile and pushed to the private registry, the same way
# workhub-platform-portal builds a second image out of one repository.
#
# ── DEPLOYED WITH `docker compose up`, NOT `docker stack deploy` ──────────────
#
# Komodo uses Compose here — its container names are `<project>-<service>-<n>`,
# which is Compose's scheme, not Swarm's `<stack>_<service>.<slot>`. Two things
# follow, and the first version of this file got both wrong:
#
#   • The overlay network must be `attachable: true`. Swarm refuses to let a
#     plain container join a swarm-scoped overlay otherwise, which fails with
#     "network ... not manually attachable". `hubconnect` sets this for the same
#     reason.
#
#   • Only ONE replica can publish a fixed host port. Compose honours
#     `deploy.replicas` by starting that many containers, and each one binds
#     3010 on the host — so a second replica dies on a port conflict. Swarm's
#     routing mesh would have shared the port; Compose has no such thing. Every
#     working stack on this instance runs a single replica for this reason.
#
# `deploy.mode`, `update_config` and `placement` are Swarm-only and silently
# ignored by Compose, so they are not used here rather than implying behaviour
# this deployment does not have. A redeploy therefore has a short gap while the
# container restarts; for documentation that is an acceptable trade against the
# complexity of fronting it with something that can drain connections.

services:
  hubsign-docs:
    image: 172.16.15.51:5000/futureedge/hubsign-docs:latest

    restart: unless-stopped

    ports:
      # 3010 verified free across the swarm. Point the reverse proxy for
      # docs.hubsign.io here. Container listens on 80 (nginx).
      - "3010:80"

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

    labels:
      - "komodo.stack=hubsign-docs"

    networks:
      - hubsign-docs-net

networks:
  hubsign-docs-net:
    driver: overlay
    # Required — see the note above. Without it the container cannot join.
    attachable: true
